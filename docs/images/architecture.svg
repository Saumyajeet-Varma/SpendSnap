<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
    <rect width="1200" height="700" rx="24" fill="#f8fafc"/>
    <text x="600" y="55" text-anchor="middle" fill="#0f172a" font-size="30" font-family="Arial" font-weight="700">SpendWise application architecture</text>
    <g font-family="Arial" text-anchor="middle">
      <rect x="370" y="90" width="460" height="85" rx="16" fill="#0f172a"/><text x="600" y="124" fill="#ffffff" font-size="22" font-weight="700">React + Vite + TypeScript</text><text x="600" y="151" fill="#cbd5e1" font-size="16">Pages · Forms · Charts · Query cache</text>
      <path d="M600 175V220" stroke="#64748b" stroke-width="3"/><path d="M590 210L600 222L610 210" fill="none" stroke="#64748b" stroke-width="3"/>
      <rect x="370" y="225" width="460" height="85" rx="16" fill="#0d9488"/><text x="600" y="260" fill="#ffffff" font-size="22" font-weight="700">Express REST API</text><text x="600" y="286" fill="#ecfeff" font-size="16">Auth · Validation · Authorization</text>
      <path d="M600 310V355" stroke="#64748b" stroke-width="3"/><path d="M590 345L600 357L610 345" fill="none" stroke="#64748b" stroke-width="3"/>
      <rect x="90" y="365" width="300" height="120" rx="16" fill="#dbeafe" stroke="#93c5fd"/><text x="240" y="400" fill="#1e3a8a" font-size="20" font-weight="700">Personal Finance</text><text x="240" y="430" fill="#1e40af" font-size="15">Transactions · Budgets</text><text x="240" y="455" fill="#1e40af" font-size="15">Accounts · Analytics</text>
      <rect x="450" y="365" width="300" height="120" rx="16" fill="#ccfbf1" stroke="#5eead4"/><text x="600" y="400" fill="#115e59" font-size="20" font-weight="700">Shared Household</text><text x="600" y="430" fill="#115e59" font-size="15">Splits · Balances</text><text x="600" y="455" fill="#115e59" font-size="15">Settlements · Members</text>
      <rect x="810" y="365" width="300" height="120" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="960" y="400" fill="#92400e" font-size="20" font-weight="700">Supporting Modules</text><text x="960" y="430" fill="#92400e" font-size="15">Recurring · Categories</text><text x="960" y="455" fill="#92400e" font-size="15">Export · Audit logs</text>
      <path d="M600 485V530" stroke="#64748b" stroke-width="3"/><path d="M240 485V510H600 M960 485V510H600" stroke="#64748b" stroke-width="3" fill="none"/><path d="M590 520L600 532L610 520" fill="none" stroke="#64748b" stroke-width="3"/>
